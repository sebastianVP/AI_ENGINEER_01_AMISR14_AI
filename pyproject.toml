[project]
name = "ai-engineer-01-amisr14-ai"
version = "0.1.0"
description = "Herramienta para asistir en la preparación de informes técnicos semanales del radar AMISR-14 mediante Python, uv, Google Docs API y la API de OpenAI."
readme = "README.md"
authors = [
    { name = "sebastianVP", email = "alex.valdezp22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-engineer-01-amisr14-ai = "ai_engineer_01_amisr14_ai:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
